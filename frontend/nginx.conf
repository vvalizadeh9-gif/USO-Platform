# nginx configuration for the UEP frontend container.
#
# As shipped this serves plain HTTP on port 80, which is what the current
# deployment uses. Everything needed for HTTPS is written out below but left
# commented, because enabling it without a certificate in place stops nginx from
# starting at all and takes the site down.
#
# Read TLS-SETUP.md before uncommenting anything. It covers both routes --
# Let's Encrypt for a public domain name, or a certificate issued by your own
# organisation for an internal server -- and says exactly which lines to change.

# ---------------------------------------------------------------------------
# Shared settings, used by whichever server block is active.
# ---------------------------------------------------------------------------

# Allow large CPM workbooks (10 MB+ real files, plus headroom).
client_max_body_size 75M;

# ===========================================================================
# ACTIVE: plain HTTP.
#
# When you switch to HTTPS, replace this whole block with the redirect block
# further down, so that anyone typing the bare address is sent to the secure
# version instead of being served over plain HTTP.
# ===========================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy: limits where the page may load things from, so a
    # script injected into the page cannot call out to an attacker's server.
    #
    # fonts.googleapis.com and fonts.gstatic.com are listed because
    # src/styles/app.css imports Space Grotesk, Inter and Vazirmatn from Google
    # Fonts. If those two entries are removed the site still works but falls
    # back to system fonts, and Farsi text in particular will look wrong.
    # Self-hosting the three fonts would let both entries go -- worth doing on
    # an internal server that has no route to the public internet. See
    # FINDINGS.md.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API is reverse-proxied to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A full monthly CPM import (15k+ rows) can run past the default 60s
        # proxy timeout. The importer itself is now fast, but these generous
        # timeouts remove any remaining ceiling so large uploads never fail
        # with a 504.
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # SPA routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ===========================================================================
# NOT ACTIVE -- HTTPS. Requires a certificate. See TLS-SETUP.md.
#
# To enable:
#   1. Get a certificate and key onto the server (TLS-SETUP.md explains how,
#      for both a public domain and an internal certificate authority).
#   2. Mount them into this container. docker-compose.yml already has the line
#      for it, also commented, next to the frontend service.
#   3. Replace `uep.example.com` below with the real address, in both blocks.
#   4. Delete or comment out the plain-HTTP server block above, and uncomment
#      the redirect block and the TLS block below.
#   5. Check the file before restarting anything:
#        docker compose exec frontend nginx -t
#      Only restart once that prints "syntax is ok" and "test is successful".
#      Restarting with a broken certificate path takes the whole site down.
# ===========================================================================

# --- Send all plain HTTP to HTTPS ------------------------------------------
#
# The ACME location is what Let's Encrypt uses to prove you control the domain,
# and it must stay reachable over plain HTTP or renewals fail. Leave it in even
# after switching to HTTPS. It is harmless if you use an internal certificate.
#
# server {
#     listen 80;
#     server_name uep.example.com;
#
#     location /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#     }
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }

