server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow large CPM workbooks (10 MB+ real files, plus headroom).
    client_max_body_size 75M;

    # API is reverse-proxied to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A full monthly CPM import (15k+ rows) can run past the default 60s
        # proxy timeout. The importer itself is now fast, but these generous
        # timeouts remove any remaining ceiling so large uploads never fail
        # with a 504.
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # SPA routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
