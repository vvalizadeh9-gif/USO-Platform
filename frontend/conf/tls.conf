# HTTPS, plus a redirect from plain HTTP.
#
# Selected by docker-entrypoint.sh when UEP_ENABLE_TLS=true. The entrypoint
# checks the certificate and key exist before nginx is started and refuses to
# start without them, so a missing certificate is a container that will not
# come up with a readable reason -- never a site that quietly serves HTTP while
# everyone believes it is encrypted.
#
# @@UEP_SERVER_NAME@@ is replaced at start-up with UEP_SERVER_NAME. It is a
# placeholder rather than a shell variable so that nginx's own $host and
# $uri below cannot be substituted by accident. See TLS-SETUP.md.

client_max_body_size 25M;

# --- Send all plain HTTP to HTTPS ------------------------------------------
#
# The ACME location is what Let's Encrypt uses to prove you control the domain,
# and it must stay reachable over plain HTTP or renewals fail. It is harmless
# if you use a certificate from your own organisation's authority instead.
server {
    listen 8080;
    server_name @@UEP_SERVER_NAME@@;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- The real site ---------------------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name @@UEP_SERVER_NAME@@;

    root /usr/share/nginx/html;
    index index.html;

    # Paths inside the container. docker-compose.yml maps a host directory (or
    # the certbot volume) to /etc/nginx/certs. UEP_CERT_DIR moves this if the
    # files sit deeper -- certbot nests them under live/<domain>/.
    ssl_certificate     @@UEP_CERT_DIR@@/fullchain.pem;
    ssl_certificate_key @@UEP_CERT_DIR@@/privkey.pem;

    # Modern protocols only. TLS 1.0 and 1.1 are broken and long deprecated.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers-tls.conf;

    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers-tls.conf;
    }
}
