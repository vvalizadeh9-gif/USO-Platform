# The reverse proxy to the backend container. Shared by both server variants so
# the two cannot drift apart.
proxy_pass http://backend:8000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# A full monthly CPM import (15k+ rows) can run past the default 60s proxy
# timeout, so these are generous. Request buffering is off so the backend can
# stream an upload and reject an oversized one without nginx spooling it first.
proxy_connect_timeout 600s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
proxy_request_buffering off;
