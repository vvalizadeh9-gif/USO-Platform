# Plain HTTP. The default, and what the deployment used before TLS existed.
#
# This file is selected by docker-entrypoint.sh when UEP_ENABLE_TLS is not
# "true". Nothing here needs editing to switch to HTTPS -- set UEP_ENABLE_TLS
# and mount a certificate, and tls.conf is used instead. See TLS-SETUP.md.

client_max_body_size 25M;

server {
    # 8080, not 80: this container runs as an unprivileged user and cannot bind
    # a port below 1024. docker-compose.yml maps the host's port 80 to this one.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Let's Encrypt proves you control the domain by fetching a file from
    # here over plain HTTP. It has to work *before* there is a certificate, so
    # it lives in the HTTP config, not only the TLS one -- otherwise the first
    # issuance has nowhere to answer from and Route A cannot be started at all.
    # Harmless if you use an internal certificate authority instead.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # SPA routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively. The headers are repeated because this
    # block sets one of its own -- see security-headers.conf for why that
    # matters.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
