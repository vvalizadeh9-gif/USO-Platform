# The same headers as security-headers.conf, plus the two that only mean
# anything over HTTPS. Kept as a separate file rather than an include-plus-
# extras, because add_header's replace-don't-accumulate rule applies to
# includes too and the result would be exactly the bug this pair exists to
# avoid.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS: tells the browser to refuse plain HTTP for this site from now on.
#
# Deliberately starting at five minutes, not a year. Browsers remember this for
# the full max-age and there is no way to withdraw it early, so a certificate
# that later expires unrenewed makes the site unreachable rather than falling
# back to HTTP. Raise this to 31536000 once renewal has run unattended for a
# few weeks -- that is a one-word edit here, and it is the right order to do it
# in.
add_header Strict-Transport-Security "max-age=300" always;

# Same policy as the HTTP file, plus upgrade-insecure-requests, which tells the
# browser to fetch anything still written as http:// over https://.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
