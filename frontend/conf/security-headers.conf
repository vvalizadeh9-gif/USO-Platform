# Security headers, in one file because nginx makes repeating them mandatory.
#
# add_header does not accumulate down the configuration tree: a block that sets
# any header of its own replaces the entire inherited set. So every location
# that adds a header of its own -- /assets/ adds Cache-Control -- has to repeat
# all of these, or it silently serves none of them. Including one file is how
# that repetition stays correct when someone edits the policy.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy: limits where the page may load things from, so a
# script injected into the page cannot call out to an attacker's server.
#
# Every source is 'self'. The three web fonts are served by this application
# rather than by Google, so the policy needs no third-party origin at all --
# which is both stricter and a requirement for a server with no route to the
# public internet.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
