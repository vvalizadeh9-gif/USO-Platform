# One acceptance evidence file, opened in the validation pages' viewer
# (UEP-16). The viewer frames a letter's PDF in the browser's own viewer, so
# this one response may be framed by this site ('self') -- every other response
# keeps frame-ancestors 'none'. The backend serves it inline only when its
# magic bytes proved it a PDF or an image, and with nosniff.
#
# Included inside a location, so it repeats the other security headers (see
# security-headers.conf for why nginx makes that mandatory).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
