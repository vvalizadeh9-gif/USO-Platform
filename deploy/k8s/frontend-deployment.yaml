# The frontend: nginx serving the app's files, adding the security headers and
# proxying /api to the backend (UEP-23). Replicas and resources are in
# sizing.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # imagePullSecrets:
      #   - name: uep-registry
      securityContext:
        runAsNonRoot: true
        # The nginx-unprivileged image's own user.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: frontend
      containers:
        - name: frontend
          # The registry and tag are filled in by kustomization.yaml.
          image: uep-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: UEP_ENABLE_TLS
              valueFrom:
                configMapKeyRef:
                  name: uep-config
                  key: UEP_ENABLE_TLS
            - name: UEP_SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: uep-config
                  key: UEP_SERVER_NAME
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            # nginx-unprivileged keeps its pid file and temp files in /tmp.
            - name: tmp
              mountPath: /tmp
            # The entrypoint writes default.conf here at start-up.
            - name: conf-d
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: conf-d
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
