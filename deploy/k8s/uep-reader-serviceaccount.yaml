# Read-only access for Admin > System health (UEP-25). NOT in the default
# kustomization: DevOps reviews and applies this file. See
# docs/devops/uep-25-read-access-request.md for the note to send them.
#
# What it grants: the UEP backend may READ, in namespace prd-uep only,
#   * pods            -- which UEP pods run, are ready, restarted, and the
#                        image tag (the version shown on System health);
#   * resourcequotas  -- the namespace's CPU and memory limits;
#   * limitranges     -- the per-container limits;
#   * metrics.k8s.io pods -- CPU and memory each pod uses (metrics-server).
# Verbs are get and list only. No secrets, config maps, logs, exec, or
# anything outside prd-uep. No write of any kind.
#
# Until this is applied, System health shows the App and Resources blocks as
# "Not connected" in grey and every other block works.
#
# After DevOps applies it, turn it on for the backend: add
#   - path: optional/uep-reader-patch.yaml
# to "patches:" in deploy/k8s/kustomization.yaml and redeploy. (The patch is
# separate so a Deployment never names a ServiceAccount that does not exist
# yet -- Kubernetes would refuse to start new pods.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uep-reader
  namespace: prd-uep
  labels:
    app.kubernetes.io/part-of: uep
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uep-reader
  namespace: prd-uep
  labels:
    app.kubernetes.io/part-of: uep
rules:
  - apiGroups: [""]
    resources: ["pods", "resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uep-reader
  namespace: prd-uep
  labels:
    app.kubernetes.io/part-of: uep
subjects:
  - kind: ServiceAccount
    name: uep-reader
    namespace: prd-uep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uep-reader
