# TEMPLATE ONLY -- every value is CHANGE_ME. Not listed in kustomization.yaml,
# and nothing in this repository ever holds the real values (UEP-23).
#
# A Secret is like a ConfigMap but for passwords and keys: Kubernetes keeps it
# apart and Rancher hides the values. UEP's pods read it as environment
# variables.
#
# Create the real one by hand -- preferably in Rancher, so no password is ever
# typed into a command history (KUBERNETES-RUNBOOK.md step 4):
#   Rancher → cluster mtn-local → Storage → Secrets → Create → Opaque,
#   namespace prd-uep, name uep-secrets, the six keys below.
#
# Or, from a copy of this file named secret.yaml (git-ignored -- never commit
# it):  kubectl apply -n prd-uep -f deploy/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: uep-secrets
  namespace: prd-uep
type: Opaque
stringData:
  # The database login IT gave (uep_app_svc) and its password, which IT sends
  # separately. Any characters are fine -- UEP escapes them.
  DB_USER: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  # At least 32 random characters. Changing it later signs everyone out.
  # Windows PowerShell (one line; prints 64 random hex characters):
  #   $b = New-Object byte[] 32; [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b); -join ($b | % { $_.ToString('x2') })
  # Linux:  openssl rand -hex 32
  JWT_SECRET_KEY: "CHANGE_ME"
  # The first administrator, created once on the first start. Changing these
  # later does not change an existing account.
  FIRST_ADMIN_USERNAME: "CHANGE_ME"
  FIRST_ADMIN_PASSWORD: "CHANGE_ME"
  FIRST_ADMIN_FULLNAME: "CHANGE_ME"
---
# Only if the image registry needs a login (IT will say). Rancher:
#   Storage → Secrets → Create → Registry, namespace prd-uep, name uep-registry.
# Then uncomment "imagePullSecrets" in both Deployment files.
# kubectl alternative (run on the Admin server, not in a shared history):
#   kubectl create secret docker-registry uep-registry -n prd-uep \
#     --docker-server=<registry host> --docker-username=<user> --docker-password=<password>
