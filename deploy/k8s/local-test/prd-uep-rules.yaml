# A copy of prd-uep's ResourceQuota and LimitRange as IT showed them on
# 22 Nov 2026 (UEP-23), for practising on a local cluster (kind or k3d) and for
# the "Kubernetes smoke test" CI job. NEVER apply this to IT's cluster -- the
# real namespace already has its own.
#
#   kubectl create namespace prd-uep
#   kubectl apply -f deploy/k8s/local-test/prd-uep-rules.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prd-uep-quota
  namespace: prd-uep
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "100"
    services: "25"
    configmaps: "25"
    secrets: "60"
    count/deployments.apps: "25"
    count/replicasets.apps: "100"
    persistentvolumeclaims: "0"
    requests.storage: "0"
    requests.ephemeral-storage: "0"
    limits.ephemeral-storage: "0"
    count/statefulsets.apps: "0"
    count/jobs.batch: "0"
    count/cronjobs.batch: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: prd-uep-limits
  namespace: prd-uep
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      min:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
