# A throwaway PostgreSQL standing in for IT's database server, for a local
# cluster and the CI smoke test only (UEP-23). It lives in its own namespace,
# outside prd-uep, and answers on port 5444 like IT's server. NEVER apply this
# to IT's cluster.
#
#   kubectl create namespace dbtest
#   kubectl create secret generic postgres -n dbtest --from-literal=password='<pick one>'
#   kubectl apply -f deploy/k8s/local-test/postgres.yaml
#
# DB_HOST in site.env is then postgres.dbtest.svc.cluster.local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dbtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: uep_app_svc
            - name: POSTGRES_DB
              value: uep_prd
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "uep_app_svc", "-d", "uep_prd"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dbtest
spec:
  selector:
    app: postgres
  ports:
    - port: 5444
      targetPort: 5432
