# Runs the whole test suite on every push and pull request.
#
# Why this matters more than it looks: these tests are the only thing that will
# tell a future maintainer they have broken something. The person who
# understands this platform is not a developer, and by the time anyone else
# touches the code the original context will be gone. A red tick on a pull
# request is the safety net.
#
# Results appear on the Actions tab in GitHub, and on each pull request.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets you re-run the suite by hand from the Actions tab without pushing.
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL for tests/test_migrations.py. The rest of the suite
      # uses SQLite, but the migration tests check things SQLite cannot express
      # -- foreign key constraints, timestamptz versus timestamp, ALTER TABLE
      # behaviour -- which is precisely the class of bug that made the schema
      # consolidation necessary. Without this service they would quietly skip.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uep
          POSTGRES_PASSWORD: uep_test_password
          POSTGRES_DB: uep_test
        ports:
          - 5432:5432
        # Do not start the tests until the database is genuinely accepting
        # connections, or the first one races it and fails for no real reason.
        options: >-
          --health-cmd "pg_isready -U uep -d uep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the version in backend/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        working-directory: backend
        env:
          # Marks this as a development environment. Production refuses to start
          # on the default JWT secret and admin password; the suite uses both on
          # purpose, so it has to say what it is.
          APP_ENV: development
          # Enables the PostgreSQL migration tests. Without it they skip.
          UEP_TEST_POSTGRES_URL: postgresql+psycopg://uep:uep_test_password@localhost:5432/uep_test
        run: pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the version in frontend/Dockerfile.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`, the same as the Dockerfile: it
      # installs exactly what package-lock.json specifies and fails if the lock
      # file and package.json disagree. That failure is worth having -- it means
      # the build here would differ from the build on the server.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # There are no frontend tests yet. Building still catches a real class of
      # mistake: a syntax error, a missing import, a component referring to
      # something that no longer exists. Those would otherwise only surface at
      # deploy time, when the site is down.
      - name: Build
        working-directory: frontend
        run: npm run build
