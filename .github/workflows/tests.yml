# Runs the whole test suite on every push and pull request.
#
# Why this matters more than it looks: these tests are the only thing that will
# tell a future maintainer they have broken something. The person who
# understands this platform is not a developer, and by the time anyone else
# touches the code the original context will be gone. A red tick on a pull
# request is the safety net.
#
# Results appear on the Actions tab in GitHub, and on each pull request.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets you re-run the suite by hand from the Actions tab without pushing.
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL for tests/test_migrations.py. The rest of the suite
      # uses SQLite, but the migration tests check things SQLite cannot express
      # -- foreign key constraints, timestamptz versus timestamp, ALTER TABLE
      # behaviour -- which is precisely the class of bug that made the schema
      # consolidation necessary. Without this service they would quietly skip.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uep
          POSTGRES_PASSWORD: uep_test_password
          POSTGRES_DB: uep_test
        ports:
          - 5432:5432
        # Do not start the tests until the database is genuinely accepting
        # connections, or the first one races it and fails for no real reason.
        options: >-
          --health-cmd "pg_isready -U uep -d uep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the version in backend/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # From the lock file, with hashes, the same way the Docker image
          # does it -- so CI is testing the dependency set that will actually
          # be deployed rather than whatever the index resolves today.
          pip install --require-hashes -r requirements.lock
          pip install pytest httpx

      # A lock file that has drifted from requirements.txt is worse than none:
      # it looks authoritative and is not. This regenerates it and fails if the
      # result differs, so adding a dependency without recompiling is caught
      # here rather than at the next deploy.
      - name: Check the lock file is in sync
        working-directory: backend
        run: |
          pip install pip-tools
          cp requirements.lock requirements.lock.committed
          pip-compile --generate-hashes --strip-extras \
            --output-file=requirements.lock --quiet requirements.txt
          if ! diff -q requirements.lock.committed requirements.lock; then
            echo "::error::requirements.lock is out of date. Regenerate it with:"
            echo "  cd backend && pip-compile --generate-hashes --strip-extras \\"
            echo "      --output-file=requirements.lock requirements.txt"
            diff requirements.lock.committed requirements.lock || true
            exit 1
          fi
          mv requirements.lock.committed requirements.lock

      - name: Run tests
        working-directory: backend
        env:
          # Marks this as a development environment. Production refuses to start
          # on the default JWT secret and admin password; the suite uses both on
          # purpose, so it has to say what it is.
          APP_ENV: development
          # Enables the PostgreSQL migration tests. Without it they skip.
          UEP_TEST_POSTGRES_URL: postgresql+psycopg://uep:uep_test_password@localhost:5432/uep_test
        run: pytest -v

      - name: Lint
        working-directory: backend
        run: |
          pip install ruff
          ruff check .

      # Nothing else in this repository will say when a pinned dependency
      # acquires a published advisory. Over a ten-year deployment that silence
      # is the single largest source of security decay, and this is the
      # cheapest thing that breaks it.
      - name: Audit dependencies for known vulnerabilities
        working-directory: backend
        # Reports without failing the build: an advisory published overnight
        # would otherwise block an unrelated pull request, which teaches people
        # to ignore the job. Read it on the Actions tab, or in the PR checks.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.lock --desc

  # UEP-23. Renders deploy/k8s/, validates it for the cluster's Kubernetes
  # version, and checks it against prd-uep's quota, LimitRange and forbidden
  # kinds -- so a manifest the cluster would refuse is caught here.
  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.6.7
      KUBERNETES_VERSION: 1.30.4
    steps:
      - uses: actions/checkout@v4

      - name: Render
        run: kubectl kustomize deploy/k8s/ > rendered.yaml

      - name: Validate for Kubernetes ${{ env.KUBERNETES_VERSION }}
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version "$KUBERNETES_VERSION" rendered.yaml

      - name: Check against prd-uep's rules
        run: |
          pip install --quiet pyyaml
          python scripts/check_k8s_manifests.py rendered.yaml

      - name: No secret value in the template
        run: |
          # Every value in the Secret template must be the placeholder.
          if grep -E '^\s+[A-Z_]+:\s*"' deploy/k8s/secret.example.yaml | grep -v '"CHANGE_ME"'; then
            echo "::error::deploy/k8s/secret.example.yaml must hold only CHANGE_ME values."
            exit 1
          fi

  # UEP-23. Runs the real images the way the cluster will: read-only root
  # filesystem, memory-only /tmp, non-root, no capabilities, database
  # settings as parts with a password full of URL-special characters, and two
  # backends starting at the same moment against an empty database.
  containers:
    name: Container smoke test
    runs-on: ubuntu-24.04
    env:
      # Not a real secret: a throwaway database that lives for this job only.
      # Deliberately full of characters that break a hand-written URL.
      DB_PW: "Sm0ke@test:p/w%40#x"
    steps:
      - uses: actions/checkout@v4

      - name: Build both images
        run: |
          docker build -t uep-backend:ci backend
          docker build -t uep-frontend:ci frontend

      - name: Start PostgreSQL
        run: |
          docker network create uep
          docker run -d --name db --network uep \
            -e POSTGRES_USER=uep_app_svc -e POSTGRES_PASSWORD="$DB_PW" -e POSTGRES_DB=uep_prd \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U uep_app_svc -d uep_prd && break
            sleep 2
          done

      - name: Start two backends at once (read-only, non-root)
        run: |
          for n in 1 2; do
            alias=""; [ "$n" = 1 ] && alias="--network-alias backend"
            docker run -d --name "backend$n" --network uep $alias \
              --read-only --tmpfs /tmp:size=256m --user 10001:10001 \
              --cap-drop ALL --security-opt no-new-privileges \
              -e APP_ENV=production -e TRUSTED_PROXY_HOPS=2 \
              -e DB_HOST=db -e DB_PORT=5432 -e DB_NAME=uep_prd \
              -e DB_USER=uep_app_svc -e DB_PASSWORD="$DB_PW" \
              -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
              -e FIRST_ADMIN_USERNAME=admin -e FIRST_ADMIN_PASSWORD="Smoke-test-admin-passw0rd" \
              -e CORS_ORIGINS=https://uep.example.test \
              uep-backend:ci
          done

      - name: Both become ready
        run: |
          for n in 1 2; do
            ok=""
            for i in $(seq 1 60); do
              if docker run --rm --network uep curlimages/curl:8.10.1 -fsS "http://backend$n:8000/api/health/ready" 2>/dev/null | grep -q '"ready"'; then
                ok=1; break
              fi
              sleep 3
            done
            docker logs "backend$n" > "backend$n.log" 2>&1 || true
            if [ -z "$ok" ]; then cat "backend$n.log"; echo "::error::backend$n never became ready"; exit 1; fi
          done
          echo "--- backend1 ---"; head -30 backend1.log
          echo "--- backend2 ---"; head -30 backend2.log

      - name: Pre-flight lines, one migration, no duplicate seed rows, no password in logs
        run: |
          for n in 1 2; do
            grep -q '^\[preflight\] ✔ Settings present: uep_app_svc@db:5432/uep_prd' "backend$n.log"
            grep -q '^\[preflight\]   Database check passed.' "backend$n.log"
            grep -q 'Migrations applied' "backend$n.log"
          done
          if grep -F -- "$DB_PW" backend1.log backend2.log; then
            echo "::error::the database password appeared in a backend log"; exit 1
          fi
          dupes=$(docker exec db psql -U uep_app_svc -d uep_prd -tAc \
            "SELECT count(*) FROM (SELECT name FROM roles GROUP BY name HAVING count(*) > 1) d")
          test "$dupes" = "0"
          admins=$(docker exec db psql -U uep_app_svc -d uep_prd -tAc "SELECT count(*) FROM users WHERE username = 'admin'")
          test "$admins" = "1"

      - name: A wrong password stops the container with a readable line
        run: |
          set +e
          docker run --rm --network uep --read-only --tmpfs /tmp \
            -e APP_ENV=production -e DB_HOST=db -e DB_PORT=5432 -e DB_NAME=uep_prd \
            -e DB_USER=uep_app_svc -e DB_PASSWORD=wrong-password \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" -e FIRST_ADMIN_PASSWORD=Whatever-passw0rd-1 \
            -e CORS_ORIGINS=https://uep.example.test uep-backend:ci > wrong.log 2>&1
          code=$?
          set -e
          cat wrong.log
          test "$code" != "0"
          grep -q '^\[preflight\] ✘ The database refused user "uep_app_svc"' wrong.log

      - name: Frontend runs read-only and proxies to the backend
        run: |
          docker run -d --name frontend --network uep \
            --read-only --tmpfs /tmp --tmpfs /etc/nginx/conf.d:mode=1777 --user 101:101 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e UEP_ENABLE_TLS=false -e UEP_SERVER_NAME=_ uep-frontend:ci
          for i in $(seq 1 20); do
            docker run --rm --network uep curlimages/curl:8.10.1 -fsS http://frontend:8080/api/health/ready && break
            sleep 2
          done
          docker logs frontend
          docker run --rm --network uep curlimages/curl:8.10.1 -fsS http://frontend:8080/ | grep -qi '<html'

      - name: nginx passes the Ingress's X-Forwarded-Proto through
        run: |
          # A stand-in "backend" that answers with the X-Forwarded-Proto it received.
          docker network create echo
          docker run -d --name echo --network echo --network-alias backend python:3.12-alpine \
            python -c "
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = (self.headers.get('X-Forwarded-Proto') or 'none').encode()
                  self.send_response(200); self.send_header('Content-Length', str(len(body))); self.end_headers(); self.wfile.write(body)
          http.server.HTTPServer(('0.0.0.0', 8000), H).serve_forever()
          "
          docker run -d --name frontend-echo --network echo \
            --read-only --tmpfs /tmp --tmpfs /etc/nginx/conf.d:mode=1777 --user 101:101 \
            -e UEP_ENABLE_TLS=false uep-frontend:ci
          sleep 5
          with=$(docker run --rm --network echo curlimages/curl:8.10.1 -fsS -H 'X-Forwarded-Proto: https' http://frontend-echo:8080/api/x)
          without=$(docker run --rm --network echo curlimages/curl:8.10.1 -fsS http://frontend-echo:8080/api/x)
          echo "with header: $with / without: $without"
          test "$with" = "https"
          test "$without" = "http"

      - name: Logs on failure
        if: failure()
        run: |
          for c in backend1 backend2 frontend db echo frontend-echo; do
            echo "=== $c ==="; docker logs "$c" 2>&1 | tail -80 || true
          done

  # UEP-23. The runbook's kubectl steps on a throwaway kind cluster running the
  # same Kubernetes version as mtn-local, with prd-uep's quota and LimitRange
  # applied: deploy, check, Ingress last, pod deletion, restart, rollback, the
  # task pod and emptying the database. deploy/k8s/local-test/smoke.sh.
  kind:
    name: Kubernetes smoke test (kind)
    runs-on: ubuntu-24.04
    env:
      KIND_VERSION: v0.24.0
      KIND_NODE_IMAGE: kindest/node:v1.30.4
    steps:
      - uses: actions/checkout@v4

      - name: Build both images
        run: |
          docker build -t local/uep-backend:ci backend
          docker build -t local/uep-frontend:ci frontend

      - name: Create the kind cluster
        run: |
          curl -sSLo "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$RUNNER_TEMP/kind"
          "$RUNNER_TEMP/kind" create cluster --image "$KIND_NODE_IMAGE" --wait 120s
          "$RUNNER_TEMP/kind" load docker-image local/uep-backend:ci local/uep-frontend:ci
          kubectl version

      - name: Run the smoke test
        run: |
          pip install --quiet pyyaml
          bash deploy/k8s/local-test/smoke.sh local/uep-backend:ci local/uep-frontend:ci

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get all,events -n prd-uep || true
          for p in $(kubectl get pods -n prd-uep -o name); do
            echo "=== $p ==="; kubectl logs -n prd-uep "$p" --all-containers --tail=80 || true
          done

  frontend:
    name: Frontend build
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 cannot
    # install Chromium ("does not support chromium on ubuntu26.04-x64").
    # Move this forward with the Playwright upgrade.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches the version in frontend/Dockerfile.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`, the same as the Dockerfile: it
      # installs exactly what package-lock.json specifies and fails if the lock
      # file and package.json disagree. That failure is worth having -- it means
      # the build here would differ from the build on the server.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Building catches a real class of mistake on its own: a syntax error, a
      # missing import, a component referring to something that no longer
      # exists. Those would otherwise only surface at deploy time, when the
      # site is down.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # The layout contract: at 1440x900 and 1280x800 the one-screen pages
      # never scroll the browser page, their lists scroll inside their cards
      # and the assignment dock stays on screen. The app runs on Vite's dev
      # server with the API mocked in the page (e2e/mockApi.js), so this
      # needs no backend.
      - name: Install Chromium for the layout tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Layout tests (Playwright)
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      # Same reasoning as the backend audit above, and the same
      # report-do-not-block posture.
      - name: Audit dependencies for known vulnerabilities
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=moderate
